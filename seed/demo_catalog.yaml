# =====================================================================
# demo_catalog.yaml — the seed dataset for `python -m src.cli seed-catalog`.
#
# This file is a STARTING POINT, not the runtime source of truth. Once
# seeded, every test case lives in the DQ_TEST_CASE repository table and is
# created, edited, moved and deleted from the app. Folder structure is
# whatever the user builds; these are just sensible defaults.
#
# test_type decides what "passing" means:
#   SQL_ROWCOUNT           zero rows returned = PASS   (rule checks)
#   SOURCE_TARGET_COMPARE  match on key_columns, diff compare_columns
#   ROW_COUNT_MATCH        source count vs target count
#   STATUS_COLUMN          query returns STATUS; any non-PASS row fails
#   INFORMATIONAL          always PASS; records rows for reporting
# =====================================================================
project:
  name: Insurance Policy & Claim
  description: >-
    Data quality and regression automation for the policy/claim pipeline:
    Staging -> Transformation -> Curated.

folders:
  - path: /Staging
    description: Landing-layer rule checks against the incoming feed.
  - path: /Transformation
    description: Mapping and derivation rules between staging and transformation.
  - path: /Source-to-Target
    description: Row-by-row transformation vs curated reconciliation.
  - path: /Linkage
    description: Referential integrity between policies and claims.
  - path: /Incremental
    description: Watermark-bounded incremental load validation.
  - path: /Historical
    description: Date-range reconciliation for late-arriving changes.
  - path: /Regression
    type: REGRESSION
    description: >-
      Saved regression scripts. Corrected defects are re-validated from here
      until the whole folder reports PASS.

test_cases:
  # ------------------------------------------------------------- Staging
  - folder: /Staging
    name: File-to-stage row count reconciliation
    description: Rows recorded for the batch must equal rows landed in staging.
    test_type: ROW_COUNT_MATCH
    scope: GENERIC
    entity: All
    layer: Staging
    severity: High
    source_sql: |
      SELECT SOURCE_ROWS FROM DQ_BATCH_METADATA WHERE BATCH_ID = :batch_id
    target_sql: |
      SELECT (SELECT COUNT(*) FROM STG_CUSTOMER WHERE BATCH_ID = :batch_id)
           + (SELECT COUNT(*) FROM STG_POLICY   WHERE BATCH_ID = :batch_id)
           + (SELECT COUNT(*) FROM STG_CLAIM    WHERE BATCH_ID = :batch_id) AS STAGED_ROWS

  - folder: /Staging
    name: Claims landing file vs staging
    description: >-
      Reconciles the landed claims file (data/claims.csv, read through the
      flat-file connection) row by row against what the loader put in
      STG_CLAIM for the batch.
    test_type: SOURCE_TARGET_COMPARE
    scope: SOURCE_TO_TARGET
    entity: Claim
    layer: Staging
    severity: High
    source_connection: flatfile
    key_columns: CLAIM_ID
    source_sql: |
      SELECT CLAIM_ID, POLICY_ID, CUSTOMER_ID, CLAIM_DATE, CLAIM_AMOUNT,
             APPROVED_AMOUNT, CLAIM_STATUS, INCIDENT_TYPE
      FROM CLAIMS
    target_sql: |
      SELECT CLAIM_ID, POLICY_ID, CUSTOMER_ID, CLAIM_DATE, CLAIM_AMOUNT,
             APPROVED_AMOUNT, CLAIM_STATUS, INCIDENT_TYPE
      FROM STG_CLAIM
      WHERE BATCH_ID = :batch_id

  - folder: /Staging
    name: Policy ID is mandatory
    description: POLICY_ID is the business key and can never be null or blank.
    test_type: SQL_ROWCOUNT
    scope: GENERIC
    entity: Policy
    layer: Staging
    severity: Critical
    validation_sql: |
      SELECT POLICY_ID AS BUSINESS_KEY,
             'POLICY_ID' AS COLUMN_NAME,
             'a non-null policy id' AS EXPECTED_VALUE,
             COALESCE(POLICY_ID, '<NULL>') AS ACTUAL_VALUE,
             'Policy id is null or blank' AS FAILURE_REASON
      FROM STG_POLICY
      WHERE BATCH_ID = :batch_id
        AND (POLICY_ID IS NULL OR TRIM(POLICY_ID) = '')

  - folder: /Staging
    name: Duplicate policy check
    description: A policy id must appear exactly once per batch.
    test_type: SQL_ROWCOUNT
    scope: GENERIC
    entity: Policy
    layer: Staging
    severity: Critical
    validation_sql: |
      SELECT POLICY_ID AS BUSINESS_KEY,
             'POLICY_ID' AS COLUMN_NAME,
             '1' AS EXPECTED_VALUE,
             TO_VARCHAR(COUNT(*)) AS ACTUAL_VALUE,
             'Policy id appears more than once in the batch' AS FAILURE_REASON
      FROM STG_POLICY
      WHERE BATCH_ID = :batch_id
      GROUP BY POLICY_ID
      HAVING COUNT(*) > 1

  - folder: /Staging
    name: Claim references an existing policy
    description: >-
      Every staged claim must point at a policy in the same batch or one
      already in POLICY_MASTER. Claims that don't are dropped by rule CLM-006
      and never reach curated.
    test_type: SQL_ROWCOUNT
    scope: GENERIC
    entity: Claim
    layer: Staging
    severity: Critical
    validation_sql: |
      SELECT C.CLAIM_ID AS BUSINESS_KEY,
             'POLICY_ID' AS COLUMN_NAME,
             'an existing policy id' AS EXPECTED_VALUE,
             C.POLICY_ID AS ACTUAL_VALUE,
             'Claim references a policy that is neither in the batch nor in curated' AS FAILURE_REASON
      FROM STG_CLAIM C
      LEFT JOIN STG_POLICY P
             ON P.POLICY_ID = C.POLICY_ID AND P.BATCH_ID = C.BATCH_ID
      LEFT JOIN POLICY_MASTER M ON M.POLICY_ID = C.POLICY_ID
      WHERE C.BATCH_ID = :batch_id AND P.POLICY_ID IS NULL AND M.POLICY_ID IS NULL

  - folder: /Staging
    name: Approved amount within claim amount
    description: Approved amount must be between zero and the claimed amount.
    test_type: SQL_ROWCOUNT
    scope: GENERIC
    entity: Claim
    layer: Staging
    severity: High
    validation_sql: |
      SELECT CLAIM_ID AS BUSINESS_KEY,
             'APPROVED_AMOUNT' AS COLUMN_NAME,
             '0 .. ' || TO_VARCHAR(CLAIM_AMOUNT) AS EXPECTED_VALUE,
             TO_VARCHAR(APPROVED_AMOUNT) AS ACTUAL_VALUE,
             'Approved amount is negative or exceeds the claim amount' AS FAILURE_REASON
      FROM STG_CLAIM
      WHERE BATCH_ID = :batch_id
        AND (APPROVED_AMOUNT < 0 OR APPROVED_AMOUNT > CLAIM_AMOUNT)

  # ------------------------------------------------------ Transformation
  - folder: /Transformation
    name: Policy type decode
    description: POLICY_TYPE code must decode to the mapped description.
    test_type: SQL_ROWCOUNT
    scope: GENERIC
    entity: Policy
    layer: Transformation
    severity: High
    validation_sql: |
      SELECT S.POLICY_ID AS BUSINESS_KEY,
             'POLICY_TYPE_DESC' AS COLUMN_NAME,
             CASE UPPER(TRIM(S.POLICY_TYPE))
                 WHEN 'AUTO'   THEN 'Automobile'
                 WHEN 'HOME'   THEN 'Home Insurance'
                 WHEN 'HEALTH' THEN 'Health Insurance'
                 WHEN 'LIFE'   THEN 'Life Insurance'
                 ELSE 'Unknown'
             END AS EXPECTED_VALUE,
             T.POLICY_TYPE_DESC AS ACTUAL_VALUE,
             'Policy type was not decoded per the mapping rule' AS FAILURE_REASON
      FROM STG_POLICY S
      JOIN TRN_POLICY T ON T.POLICY_ID = S.POLICY_ID AND T.BATCH_ID = S.BATCH_ID
      WHERE S.BATCH_ID = :batch_id
        AND T.POLICY_TYPE_DESC <> CASE UPPER(TRIM(S.POLICY_TYPE))
                 WHEN 'AUTO'   THEN 'Automobile'
                 WHEN 'HOME'   THEN 'Home Insurance'
                 WHEN 'HEALTH' THEN 'Health Insurance'
                 WHEN 'LIFE'   THEN 'Life Insurance'
                 ELSE 'Unknown'
             END

  - folder: /Transformation
    name: Policy term validity
    description: A policy must expire after it is issued, and the derived term must agree.
    test_type: SQL_ROWCOUNT
    scope: GENERIC
    entity: Policy
    layer: Transformation
    severity: High
    validation_sql: |
      SELECT T.POLICY_ID AS BUSINESS_KEY,
             'POLICY_TERM_DAYS' AS COLUMN_NAME,
             TO_VARCHAR(DATEDIFF(day, T.ISSUE_DATE, T.EXPIRY_DATE)) AS EXPECTED_VALUE,
             TO_VARCHAR(T.POLICY_TERM_DAYS) AS ACTUAL_VALUE,
             'Expiry precedes issue date, or the derived term is wrong' AS FAILURE_REASON
      FROM TRN_POLICY T
      WHERE T.BATCH_ID = :batch_id
        AND (T.EXPIRY_DATE < T.ISSUE_DATE
             OR T.POLICY_TERM_DAYS <> DATEDIFF(day, T.ISSUE_DATE, T.EXPIRY_DATE))

  - folder: /Transformation
    name: Claim ratio derivation
    description: CLAIM_RATIO must equal approved / claimed, and sit within 0..1.
    test_type: SQL_ROWCOUNT
    scope: GENERIC
    entity: Claim
    layer: Transformation
    severity: High
    validation_sql: |
      SELECT S.CLAIM_ID AS BUSINESS_KEY,
             'CLAIM_RATIO' AS COLUMN_NAME,
             TO_VARCHAR(ROUND(COALESCE(S.APPROVED_AMOUNT / NULLIF(S.CLAIM_AMOUNT, 0), 0), 4)) AS EXPECTED_VALUE,
             TO_VARCHAR(T.CLAIM_RATIO) AS ACTUAL_VALUE,
             'Claim ratio does not match approved / claimed, or is outside 0..1' AS FAILURE_REASON
      FROM STG_CLAIM S
      JOIN TRN_CLAIM T ON T.CLAIM_ID = S.CLAIM_ID AND T.BATCH_ID = S.BATCH_ID
      WHERE S.BATCH_ID = :batch_id
        AND (ABS(COALESCE(T.CLAIM_RATIO, 0)
                 - ROUND(COALESCE(S.APPROVED_AMOUNT / NULLIF(S.CLAIM_AMOUNT, 0), 0), 4)) > 0.0001
             OR T.CLAIM_RATIO NOT BETWEEN 0 AND 1)

  - folder: /Transformation
    name: Email standardisation
    description: Email must be lower-cased, trimmed and structurally valid.
    test_type: SQL_ROWCOUNT
    scope: GENERIC
    entity: Customer
    layer: Transformation
    severity: Medium
    validation_sql: |
      SELECT CUSTOMER_ID AS BUSINESS_KEY,
             'EMAIL' AS COLUMN_NAME,
             LOWER(TRIM(EMAIL)) AS EXPECTED_VALUE,
             EMAIL AS ACTUAL_VALUE,
             'Email is not lower-cased/trimmed, or is not a valid address' AS FAILURE_REASON
      FROM TRN_CUSTOMER
      WHERE BATCH_ID = :batch_id
        AND (EMAIL <> LOWER(TRIM(EMAIL))
             OR (EMAIL IS NOT NULL AND NOT EMAIL LIKE '%@%.%'))

  # ---------------------------------------------------- Source-to-Target
  - folder: /Source-to-Target
    name: Policy transformation vs curated
    description: >-
      Row-by-row reconciliation of TRN_POLICY against POLICY_MASTER. Reports
      missing records, unexpected records and per-column value mismatches.
    test_type: SOURCE_TARGET_COMPARE
    scope: SOURCE_TO_TARGET
    entity: Policy
    layer: Curated
    severity: Critical
    key_columns: POLICY_ID
    compare_columns: POLICY_TYPE, POLICY_STATUS, PREMIUM_AMOUNT, CUSTOMER_ID
    source_sql: |
      SELECT POLICY_ID,
             CUSTOMER_ID,
             POLICY_TYPE_DESC   AS POLICY_TYPE,
             POLICY_STATUS_DESC AS POLICY_STATUS,
             PREMIUM_AMOUNT
      FROM TRN_POLICY
      WHERE BATCH_ID = :batch_id
    target_sql: |
      SELECT POLICY_ID, CUSTOMER_ID, POLICY_TYPE, POLICY_STATUS, PREMIUM_AMOUNT
      FROM POLICY_MASTER
      WHERE POLICY_ID IN (SELECT POLICY_ID FROM TRN_POLICY WHERE BATCH_ID = :batch_id)

  - folder: /Source-to-Target
    name: Claim transformation vs curated
    description: Row-by-row reconciliation of TRN_CLAIM against CLAIM_MASTER.
    test_type: SOURCE_TARGET_COMPARE
    scope: SOURCE_TO_TARGET
    entity: Claim
    layer: Curated
    severity: Critical
    key_columns: CLAIM_ID
    compare_columns: POLICY_ID, CLAIM_STATUS, CLAIM_AMOUNT, APPROVED_AMOUNT, CLAIM_RATIO
    source_sql: |
      SELECT CLAIM_ID,
             POLICY_ID,
             CLAIM_STATUS_DESC AS CLAIM_STATUS,
             CLAIM_AMOUNT,
             APPROVED_AMOUNT,
             CLAIM_RATIO
      FROM TRN_CLAIM
      WHERE BATCH_ID = :batch_id
    target_sql: |
      SELECT CLAIM_ID, POLICY_ID, CLAIM_STATUS, CLAIM_AMOUNT, APPROVED_AMOUNT, CLAIM_RATIO
      FROM CLAIM_MASTER
      WHERE CLAIM_ID IN (SELECT CLAIM_ID FROM TRN_CLAIM WHERE BATCH_ID = :batch_id)

  - folder: /Source-to-Target
    name: Customer 360 aggregate reconciliation
    description: >-
      Curated customer aggregates must agree with the curated detail they
      summarise — for every customer the batch touched, including customers
      whose policies or claims arrived without a customer record.
    test_type: SOURCE_TARGET_COMPARE
    scope: SOURCE_TO_TARGET
    entity: Customer
    layer: Curated
    severity: High
    key_columns: CUSTOMER_ID
    compare_columns: TOTAL_PREMIUM, TOTAL_CLAIMS, TOTAL_CLAIM_AMOUNT
    tolerance: 0.01
    source_sql: |
      SELECT C.CUSTOMER_ID,
             COALESCE(POL.TOTAL_PREMIUM, 0)    AS TOTAL_PREMIUM,
             COALESCE(CLM.CLAIM_COUNT, 0)      AS TOTAL_CLAIMS,
             COALESCE(CLM.CLAIM_AMOUNT_SUM, 0) AS TOTAL_CLAIM_AMOUNT
      FROM (SELECT CUSTOMER_ID FROM TRN_CUSTOMER WHERE BATCH_ID = :batch_id
            UNION
            SELECT CUSTOMER_ID FROM CUSTOMER_360
            WHERE CUSTOMER_ID IN (SELECT CUSTOMER_ID FROM TRN_POLICY WHERE BATCH_ID = :batch_id
                                  UNION
                                  SELECT P.CUSTOMER_ID FROM TRN_CLAIM T
                                  JOIN POLICY_MASTER P ON P.POLICY_ID = T.POLICY_ID
                                  WHERE T.BATCH_ID = :batch_id)) C
      LEFT JOIN (SELECT CUSTOMER_ID, SUM(PREMIUM_AMOUNT) AS TOTAL_PREMIUM
                 FROM POLICY_MASTER GROUP BY CUSTOMER_ID) POL
             ON POL.CUSTOMER_ID = C.CUSTOMER_ID
      LEFT JOIN (SELECT P.CUSTOMER_ID, COUNT(CM.CLAIM_ID) AS CLAIM_COUNT,
                        SUM(CM.CLAIM_AMOUNT) AS CLAIM_AMOUNT_SUM
                 FROM POLICY_MASTER P
                 JOIN CLAIM_MASTER CM ON CM.POLICY_ID = P.POLICY_ID
                 GROUP BY P.CUSTOMER_ID) CLM
             ON CLM.CUSTOMER_ID = C.CUSTOMER_ID
    target_sql: |
      SELECT CUSTOMER_ID, TOTAL_PREMIUM, TOTAL_CLAIMS, TOTAL_CLAIM_AMOUNT
      FROM CUSTOMER_360
      WHERE CUSTOMER_ID IN (SELECT CUSTOMER_ID FROM TRN_CUSTOMER WHERE BATCH_ID = :batch_id
                            UNION
                            SELECT CUSTOMER_ID FROM TRN_POLICY WHERE BATCH_ID = :batch_id
                            UNION
                            SELECT P.CUSTOMER_ID FROM TRN_CLAIM T
                            JOIN POLICY_MASTER P ON P.POLICY_ID = T.POLICY_ID
                            WHERE T.BATCH_ID = :batch_id)

  # End to end: the mapping rules are re-derived from the raw staged rows and
  # compared with curated, so a wrong rule in 03_transform_load.sql is caught
  # even though transformation and curated would agree with each other.
  - folder: /Source-to-Target
    name: Policy staging vs curated (mapping rules)
    description: >-
      Applies POL-001..005 to the staged policies of the batch and reconciles
      the result row by row with POLICY_MASTER.
    test_type: SOURCE_TARGET_COMPARE
    scope: SOURCE_TO_TARGET
    entity: Policy
    layer: Curated
    severity: Critical
    key_columns: POLICY_ID
    compare_columns: CUSTOMER_ID, POLICY_TYPE, POLICY_STATUS, PREMIUM_AMOUNT, ISSUE_DATE, EXPIRY_DATE
    source_sql: |
      SELECT TRIM(POLICY_ID)   AS POLICY_ID,
             TRIM(CUSTOMER_ID) AS CUSTOMER_ID,
             CASE UPPER(TRIM(POLICY_TYPE))
                 WHEN 'AUTO'   THEN 'Automobile'
                 WHEN 'HOME'   THEN 'Home Insurance'
                 WHEN 'HEALTH' THEN 'Health Insurance'
                 WHEN 'LIFE'   THEN 'Life Insurance'
                 ELSE 'Unknown'
             END AS POLICY_TYPE,
             CASE UPPER(TRIM(POLICY_STATUS))
                 WHEN 'A' THEN 'Active'
                 WHEN 'I' THEN 'Inactive'
                 WHEN 'C' THEN 'Cancelled'
                 WHEN 'L' THEN 'Lapsed'
                 ELSE 'Unknown'
             END AS POLICY_STATUS,
             ROUND(PREMIUM_AMOUNT, 2) AS PREMIUM_AMOUNT,
             ISSUE_DATE,
             EXPIRY_DATE
      FROM STG_POLICY
      WHERE BATCH_ID = :batch_id
        AND POLICY_ID IS NOT NULL
    target_sql: |
      SELECT POLICY_ID, CUSTOMER_ID, POLICY_TYPE, POLICY_STATUS, PREMIUM_AMOUNT,
             ISSUE_DATE, EXPIRY_DATE
      FROM POLICY_MASTER
      WHERE POLICY_ID IN (SELECT TRIM(POLICY_ID) FROM STG_POLICY WHERE BATCH_ID = :batch_id)

  - folder: /Source-to-Target
    name: Claim staging vs curated (mapping rules)
    description: >-
      Applies CLM-001..006 to the staged claims of the batch and reconciles
      the result row by row with CLAIM_MASTER. Claims CLM-006 drops (no known
      policy) are expected to be absent; the /Staging linkage test lists them.
    test_type: SOURCE_TARGET_COMPARE
    scope: SOURCE_TO_TARGET
    entity: Claim
    layer: Curated
    severity: Critical
    key_columns: CLAIM_ID
    compare_columns: POLICY_ID, CLAIM_DATE, CLAIM_STATUS, CLAIM_AMOUNT, APPROVED_AMOUNT, CLAIM_RATIO
    source_sql: |
      SELECT S.CLAIM_ID,
             S.POLICY_ID,
             S.CLAIM_DATE,
             CASE UPPER(TRIM(S.CLAIM_STATUS))
                 WHEN 'P' THEN 'Pending'
                 WHEN 'A' THEN 'Approved'
                 WHEN 'R' THEN 'Rejected'
                 WHEN 'S' THEN 'Settled'
                 ELSE 'Unknown'
             END AS CLAIM_STATUS,
             S.CLAIM_AMOUNT,
             COALESCE(S.APPROVED_AMOUNT, 0) AS APPROVED_AMOUNT,
             ROUND(COALESCE(S.APPROVED_AMOUNT / NULLIF(S.CLAIM_AMOUNT, 0), 0), 4) AS CLAIM_RATIO
      FROM STG_CLAIM S
      WHERE S.BATCH_ID = :batch_id
        AND S.CLAIM_ID IS NOT NULL
        AND (EXISTS (SELECT 1 FROM STG_POLICY P
                     WHERE P.POLICY_ID = S.POLICY_ID AND P.BATCH_ID = S.BATCH_ID)
             OR EXISTS (SELECT 1 FROM POLICY_MASTER M WHERE M.POLICY_ID = S.POLICY_ID))
    target_sql: |
      SELECT CLAIM_ID, POLICY_ID, CLAIM_DATE, CLAIM_STATUS, CLAIM_AMOUNT, APPROVED_AMOUNT,
             CLAIM_RATIO
      FROM CLAIM_MASTER
      WHERE CLAIM_ID IN (SELECT CLAIM_ID FROM STG_CLAIM WHERE BATCH_ID = :batch_id)

  - folder: /Source-to-Target
    name: Customer staging vs curated (mapping rules)
    description: >-
      Applies CUS-001..003 to the staged customers of the batch and reconciles
      the result row by row with CUSTOMER_360.
    test_type: SOURCE_TARGET_COMPARE
    scope: SOURCE_TO_TARGET
    entity: Customer
    layer: Curated
    severity: High
    key_columns: CUSTOMER_ID
    compare_columns: CUSTOMER_NAME, EMAIL
    source_sql: |
      SELECT TRIM(CUSTOMER_ID) AS CUSTOMER_ID,
             COALESCE(NULLIF(UPPER(TRIM(CUSTOMER_NAME)), ''), 'UNKNOWN') AS CUSTOMER_NAME,
             LOWER(TRIM(EMAIL)) AS EMAIL
      FROM STG_CUSTOMER
      WHERE BATCH_ID = :batch_id
        AND CUSTOMER_ID IS NOT NULL
    target_sql: |
      SELECT CUSTOMER_ID, CUSTOMER_NAME, EMAIL
      FROM CUSTOMER_360
      WHERE CUSTOMER_ID IN (SELECT TRIM(CUSTOMER_ID) FROM STG_CUSTOMER WHERE BATCH_ID = :batch_id)

  # ------------------------------------------------------------- Linkage
  - folder: /Linkage
    name: No orphan claims in curated
    description: Every curated claim must resolve to a curated policy.
    test_type: SQL_ROWCOUNT
    scope: GENERIC
    entity: Policy-Claim
    layer: Curated
    severity: Critical
    validation_sql: |
      SELECT C.CLAIM_ID AS BUSINESS_KEY,
             'POLICY_ID' AS COLUMN_NAME,
             'a policy present in POLICY_MASTER' AS EXPECTED_VALUE,
             C.POLICY_ID AS ACTUAL_VALUE,
             'Curated claim points at a policy that does not exist' AS FAILURE_REASON
      FROM CLAIM_MASTER C
      LEFT JOIN POLICY_MASTER P ON P.POLICY_ID = C.POLICY_ID
      WHERE C.CLAIM_ID IN (SELECT CLAIM_ID FROM TRN_CLAIM WHERE BATCH_ID = :batch_id)
        AND P.POLICY_ID IS NULL

  - folder: /Linkage
    name: Claim date inside policy coverage
    description: A claim must fall between its policy's issue and expiry dates.
    test_type: SQL_ROWCOUNT
    scope: GENERIC
    entity: Policy-Claim
    layer: Curated
    severity: High
    validation_sql: |
      SELECT C.CLAIM_ID AS BUSINESS_KEY,
             'CLAIM_DATE' AS COLUMN_NAME,
             TO_VARCHAR(P.ISSUE_DATE) || ' .. ' || TO_VARCHAR(P.EXPIRY_DATE) AS EXPECTED_VALUE,
             TO_VARCHAR(C.CLAIM_DATE) AS ACTUAL_VALUE,
             'Claim date falls outside the policy coverage window' AS FAILURE_REASON
      FROM CLAIM_MASTER C
      JOIN POLICY_MASTER P ON P.POLICY_ID = C.POLICY_ID
      WHERE C.CLAIM_ID IN (SELECT CLAIM_ID FROM TRN_CLAIM WHERE BATCH_ID = :batch_id)
        AND (C.CLAIM_DATE < P.ISSUE_DATE OR C.CLAIM_DATE > P.EXPIRY_DATE)

  # --------------------------------------------------------- Incremental
  - folder: /Incremental
    name: Incremental watermark boundary
    description: >-
      Every policy record the batch loaded must be newer than the
      previous batch's high watermark (otherwise already-processed data was
      sent again) and no later than the high watermark committed for this
      batch. Also fails when POLICY_CURATED_LOAD was not committed for the batch —
      it was never promoted to curated, or a later batch has since moved the
      watermark on.
    test_type: SQL_ROWCOUNT
    scope: INCREMENTAL
    entity: Policy
    layer: Transformation
    severity: Critical
    validation_sql: |
      SELECT T.POLICY_ID AS BUSINESS_KEY,
             'RECORD_EFFECTIVE_TS' AS COLUMN_NAME,
             COALESCE('after ' || TO_VARCHAR(W.PREVIOUS_WATERMARK), 'no lower bound')
                 || ', up to ' || TO_VARCHAR(W.BATCH_HIGH_WATERMARK) AS EXPECTED_VALUE,
             TO_VARCHAR(T.RECORD_EFFECTIVE_TS) AS ACTUAL_VALUE,
             CASE WHEN T.RECORD_EFFECTIVE_TS <= W.PREVIOUS_WATERMARK
                  THEN 'Not newer than the previous batch''s watermark: already-processed data sent again'
                  ELSE 'Later than the high watermark committed for the batch'
             END AS FAILURE_REASON
      FROM TRN_POLICY T
      JOIN DQ_WATERMARK W
        ON W.PROCESS_NAME = 'POLICY_CURATED_LOAD' AND W.LAST_BATCH_ID = T.BATCH_ID
      WHERE T.BATCH_ID = :batch_id
        AND (T.RECORD_EFFECTIVE_TS <= W.PREVIOUS_WATERMARK
             OR T.RECORD_EFFECTIVE_TS > W.BATCH_HIGH_WATERMARK)
      UNION ALL
      SELECT :batch_id AS BUSINESS_KEY,
             'LAST_BATCH_ID' AS COLUMN_NAME,
             :batch_id AS EXPECTED_VALUE,
             COALESCE(MAX(W.LAST_BATCH_ID), '<no watermark>') AS ACTUAL_VALUE,
             'The POLICY_CURATED_LOAD watermark was not committed for this batch' AS FAILURE_REASON
      FROM TRN_POLICY T
      LEFT JOIN DQ_WATERMARK W ON W.PROCESS_NAME = 'POLICY_CURATED_LOAD'
      WHERE T.BATCH_ID = :batch_id
      HAVING MAX(CASE WHEN W.LAST_BATCH_ID = :batch_id THEN 1 ELSE 0 END) = 0

  - folder: /Incremental
    name: Incremental claim watermark boundary
    description: >-
      Every claim record the batch loaded must be newer than the
      previous batch's high watermark (otherwise already-processed data was
      sent again) and no later than the high watermark committed for this
      batch. Also fails when CLAIM_CURATED_LOAD was not committed for the batch —
      it was never promoted to curated, or a later batch has since moved the
      watermark on.
    test_type: SQL_ROWCOUNT
    scope: INCREMENTAL
    entity: Claim
    layer: Transformation
    severity: Critical
    validation_sql: |
      SELECT T.CLAIM_ID AS BUSINESS_KEY,
             'RECORD_EFFECTIVE_TS' AS COLUMN_NAME,
             COALESCE('after ' || TO_VARCHAR(W.PREVIOUS_WATERMARK), 'no lower bound')
                 || ', up to ' || TO_VARCHAR(W.BATCH_HIGH_WATERMARK) AS EXPECTED_VALUE,
             TO_VARCHAR(T.RECORD_EFFECTIVE_TS) AS ACTUAL_VALUE,
             CASE WHEN T.RECORD_EFFECTIVE_TS <= W.PREVIOUS_WATERMARK
                  THEN 'Not newer than the previous batch''s watermark: already-processed data sent again'
                  ELSE 'Later than the high watermark committed for the batch'
             END AS FAILURE_REASON
      FROM TRN_CLAIM T
      JOIN DQ_WATERMARK W
        ON W.PROCESS_NAME = 'CLAIM_CURATED_LOAD' AND W.LAST_BATCH_ID = T.BATCH_ID
      WHERE T.BATCH_ID = :batch_id
        AND (T.RECORD_EFFECTIVE_TS <= W.PREVIOUS_WATERMARK
             OR T.RECORD_EFFECTIVE_TS > W.BATCH_HIGH_WATERMARK)
      UNION ALL
      SELECT :batch_id AS BUSINESS_KEY,
             'LAST_BATCH_ID' AS COLUMN_NAME,
             :batch_id AS EXPECTED_VALUE,
             COALESCE(MAX(W.LAST_BATCH_ID), '<no watermark>') AS ACTUAL_VALUE,
             'The CLAIM_CURATED_LOAD watermark was not committed for this batch' AS FAILURE_REASON
      FROM TRN_CLAIM T
      LEFT JOIN DQ_WATERMARK W ON W.PROCESS_NAME = 'CLAIM_CURATED_LOAD'
      WHERE T.BATCH_ID = :batch_id
      HAVING MAX(CASE WHEN W.LAST_BATCH_ID = :batch_id THEN 1 ELSE 0 END) = 0

  - folder: /Incremental
    name: Incremental customer watermark boundary
    description: >-
      Every customer record the batch loaded must be newer than the
      previous batch's high watermark (otherwise already-processed data was
      sent again) and no later than the high watermark committed for this
      batch. Also fails when CUSTOMER_CURATED_LOAD was not committed for the batch —
      it was never promoted to curated, or a later batch has since moved the
      watermark on.
    test_type: SQL_ROWCOUNT
    scope: INCREMENTAL
    entity: Customer
    layer: Transformation
    severity: Critical
    validation_sql: |
      SELECT T.CUSTOMER_ID AS BUSINESS_KEY,
             'RECORD_EFFECTIVE_TS' AS COLUMN_NAME,
             COALESCE('after ' || TO_VARCHAR(W.PREVIOUS_WATERMARK), 'no lower bound')
                 || ', up to ' || TO_VARCHAR(W.BATCH_HIGH_WATERMARK) AS EXPECTED_VALUE,
             TO_VARCHAR(T.RECORD_EFFECTIVE_TS) AS ACTUAL_VALUE,
             CASE WHEN T.RECORD_EFFECTIVE_TS <= W.PREVIOUS_WATERMARK
                  THEN 'Not newer than the previous batch''s watermark: already-processed data sent again'
                  ELSE 'Later than the high watermark committed for the batch'
             END AS FAILURE_REASON
      FROM TRN_CUSTOMER T
      JOIN DQ_WATERMARK W
        ON W.PROCESS_NAME = 'CUSTOMER_CURATED_LOAD' AND W.LAST_BATCH_ID = T.BATCH_ID
      WHERE T.BATCH_ID = :batch_id
        AND (T.RECORD_EFFECTIVE_TS <= W.PREVIOUS_WATERMARK
             OR T.RECORD_EFFECTIVE_TS > W.BATCH_HIGH_WATERMARK)
      UNION ALL
      SELECT :batch_id AS BUSINESS_KEY,
             'LAST_BATCH_ID' AS COLUMN_NAME,
             :batch_id AS EXPECTED_VALUE,
             COALESCE(MAX(W.LAST_BATCH_ID), '<no watermark>') AS ACTUAL_VALUE,
             'The CUSTOMER_CURATED_LOAD watermark was not committed for this batch' AS FAILURE_REASON
      FROM TRN_CUSTOMER T
      LEFT JOIN DQ_WATERMARK W ON W.PROCESS_NAME = 'CUSTOMER_CURATED_LOAD'
      WHERE T.BATCH_ID = :batch_id
      HAVING MAX(CASE WHEN W.LAST_BATCH_ID = :batch_id THEN 1 ELSE 0 END) = 0

  - folder: /Incremental
    name: Watermark status report
    description: Current watermark position per process — reporting only, never fails.
    test_type: INFORMATIONAL
    scope: INCREMENTAL
    entity: All
    layer: Control
    severity: Low
    is_regression: false
    validation_sql: |
      SELECT PROCESS_NAME, PREVIOUS_WATERMARK, BATCH_HIGH_WATERMARK,
             LAST_BATCH_ID, ROWS_PROCESSED, LOAD_STATUS, VALIDATION_STATUS, UPDATED_TS
      FROM DQ_WATERMARK
      ORDER BY PROCESS_NAME

  # ---------------------------------------------------------- Historical
  - folder: /Historical
    name: Historical policy reconciliation (date range)
    description: >-
      For policies effective in a chosen date window, curated must hold
      the most recent version any batch delivered. Several batches can carry
      the same policy; the latest by effective time is the expected
      value, so an older file loaded after a newer one (a late-arriving
      change applied out of order) shows up here. Set history_start /
      history_end when running it.
    test_type: SOURCE_TARGET_COMPARE
    scope: HISTORICAL
    entity: Policy
    layer: Curated
    severity: High
    key_columns: POLICY_ID
    compare_columns: CUSTOMER_ID, POLICY_TYPE, POLICY_STATUS, PREMIUM_AMOUNT
    param_defaults:
      history_start: '2026-07-01'
      history_end: '2026-12-31'
    source_sql: |
      SELECT POLICY_ID, CUSTOMER_ID, POLICY_TYPE, POLICY_STATUS, PREMIUM_AMOUNT
      FROM (
          SELECT POLICY_ID,
                 CUSTOMER_ID,
                 POLICY_TYPE_DESC AS POLICY_TYPE,
                 POLICY_STATUS_DESC AS POLICY_STATUS,
                 PREMIUM_AMOUNT,
                 RECORD_EFFECTIVE_TS,
                 ROW_NUMBER() OVER (PARTITION BY POLICY_ID
                                    ORDER BY RECORD_EFFECTIVE_TS DESC, BATCH_ID DESC) AS VERSION_RANK
          FROM TRN_POLICY
      ) LATEST
      WHERE VERSION_RANK = 1
        AND RECORD_EFFECTIVE_TS >= :history_start
        AND RECORD_EFFECTIVE_TS <  DATEADD(day, 1, :history_end)
    target_sql: |
      SELECT POLICY_ID, CUSTOMER_ID, POLICY_TYPE, POLICY_STATUS, PREMIUM_AMOUNT
      FROM POLICY_MASTER
      WHERE LAST_UPDATED_TS >= :history_start
        AND LAST_UPDATED_TS <  DATEADD(day, 1, :history_end)

  - folder: /Historical
    name: Historical claim reconciliation (date range)
    description: >-
      For claims effective in a chosen date window, curated must hold
      the most recent version any batch delivered. Several batches can carry
      the same claim; the latest by effective time is the expected
      value, so an older file loaded after a newer one (a late-arriving
      change applied out of order) shows up here. Set history_start /
      history_end when running it.
    test_type: SOURCE_TARGET_COMPARE
    scope: HISTORICAL
    entity: Claim
    layer: Curated
    severity: High
    key_columns: CLAIM_ID
    compare_columns: POLICY_ID, CLAIM_STATUS, CLAIM_AMOUNT, APPROVED_AMOUNT
    param_defaults:
      history_start: '2026-07-01'
      history_end: '2026-12-31'
    source_sql: |
      SELECT CLAIM_ID, POLICY_ID, CLAIM_STATUS, CLAIM_AMOUNT, APPROVED_AMOUNT
      FROM (
          SELECT CLAIM_ID,
                 POLICY_ID,
                 CLAIM_STATUS_DESC AS CLAIM_STATUS,
                 CLAIM_AMOUNT,
                 APPROVED_AMOUNT,
                 RECORD_EFFECTIVE_TS,
                 ROW_NUMBER() OVER (PARTITION BY CLAIM_ID
                                    ORDER BY RECORD_EFFECTIVE_TS DESC, BATCH_ID DESC) AS VERSION_RANK
          FROM TRN_CLAIM
      ) LATEST
      WHERE VERSION_RANK = 1
        AND RECORD_EFFECTIVE_TS >= :history_start
        AND RECORD_EFFECTIVE_TS <  DATEADD(day, 1, :history_end)
    target_sql: |
      SELECT CLAIM_ID, POLICY_ID, CLAIM_STATUS, CLAIM_AMOUNT, APPROVED_AMOUNT
      FROM CLAIM_MASTER
      WHERE LAST_UPDATED_TS >= :history_start
        AND LAST_UPDATED_TS <  DATEADD(day, 1, :history_end)

  - folder: /Historical
    name: Historical customer reconciliation (date range)
    description: >-
      For customers effective in a chosen date window, curated must hold
      the most recent version any batch delivered. Several batches can carry
      the same customer; the latest by effective time is the expected
      value, so an older file loaded after a newer one (a late-arriving
      change applied out of order) shows up here. Set history_start /
      history_end when running it.
    test_type: SOURCE_TARGET_COMPARE
    scope: HISTORICAL
    entity: Customer
    layer: Curated
    severity: High
    key_columns: CUSTOMER_ID
    compare_columns: CUSTOMER_NAME, EMAIL
    param_defaults:
      history_start: '2026-07-01'
      history_end: '2026-12-31'
    source_sql: |
      SELECT CUSTOMER_ID, CUSTOMER_NAME, EMAIL
      FROM (
          SELECT CUSTOMER_ID,
                 CUSTOMER_NAME,
                 EMAIL,
                 RECORD_EFFECTIVE_TS,
                 ROW_NUMBER() OVER (PARTITION BY CUSTOMER_ID
                                    ORDER BY RECORD_EFFECTIVE_TS DESC, BATCH_ID DESC) AS VERSION_RANK
          FROM TRN_CUSTOMER
      ) LATEST
      WHERE VERSION_RANK = 1
        AND RECORD_EFFECTIVE_TS >= :history_start
        AND RECORD_EFFECTIVE_TS <  DATEADD(day, 1, :history_end)
    target_sql: |
      SELECT CUSTOMER_ID, CUSTOMER_NAME, EMAIL
      FROM CUSTOMER_360
